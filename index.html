<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>指示文5選</title>
<style>
  :root {
    --ink: #05040a;
    --ink2: #0d0a14;
    --card: #14101c;
    --gold-1: #fff3c4;
    --gold-2: #e6c063;
    --gold-3: #9c6f1c;
    --line: rgba(214,178,92,.42);
    --body: #ded7cc;
    --muted: #9a927f;
    --mincho: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "MS PMincho", serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--ink); color: var(--body);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif;
    line-height: 1.9; font-size: 15px;
  }
  .page {
    position: relative; width: min(100%, 430px); margin: 0 auto;
    background: var(--ink); box-shadow: 0 24px 80px rgba(0,0,0,.72); overflow: hidden;
  }
  .p { display: inline-block; }
  .gold {
    background: linear-gradient(178deg, var(--gold-1) 8%, var(--gold-2) 46%, var(--gold-3) 96%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .rule { display: flex; align-items: center; gap: 10px; margin: 0 0 20px; }
  .rule::before, .rule::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--line), transparent);
  }
  .rule i {
    width: 7px; height: 7px; transform: rotate(45deg);
    background: var(--gold-2); box-shadow: 0 0 8px rgba(230,192,99,.7);
  }
  .ribbon {
    display: inline-block; padding: 7px 20px 8px;
    border: 1px solid var(--line); border-radius: 3px;
    font-size: 12px; letter-spacing: .22em; font-weight: 700;
    background: rgba(230,192,99,.06); color: #efe6cd;
  }

  /* ---- FV：背景 / 人物 / 文字 ---- */
  .stage { position: relative; line-height: 0; }
  .stage-bg { display: block; width: 100%; height: auto; }
  .stage-veil {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(5,4,10,.9) 0%, rgba(5,4,10,.6) 22%, rgba(5,4,10,.18) 40%, rgba(5,4,10,0) 52%),
      linear-gradient(to top, rgba(5,4,10,.96) 0%, rgba(5,4,10,.5) 16%, rgba(5,4,10,0) 36%);
  }
  .stage-person {
    position: absolute; left: 50%; bottom: 0; width: 66%; transform: translateX(-50%);
    height: auto; filter: drop-shadow(0 12px 22px rgba(0,0,0,.55));
  }
  .stage-text { position: absolute; left: 0; right: 0; top: 30%; padding: 0 20px; text-align: center; line-height: 1.4; }
  .stage-title {
    margin: 14px 0 0; font-family: var(--mincho); font-weight: 900;
    font-size: 58px; letter-spacing: .1em; text-shadow: 0 0 22px rgba(230,192,99,.35);
  }
  .stage-sub { margin: 6px 0 0; font-size: 13px; letter-spacing: .14em; color: #efe6cd; text-shadow: 0 1px 6px rgba(0,0,0,.85); }
  .stage-cta { position: absolute; left: 0; right: 0; bottom: 4%; padding: 0 20px; line-height: 1; }

  .btn-gold {
    display: block; width: 100%; text-align: center; text-decoration: none;
    padding: 17px 18px 18px; border: 1px solid #f2dfa4; border-radius: 999px;
    background: linear-gradient(180deg, #f6d98a 0%, #d8a93f 52%, #a9761d 100%);
    color: #2a1c02; font: 800 16.5px/1.3 var(--mincho); letter-spacing: .06em;
    cursor: pointer; box-shadow: 0 0 0 4px rgba(214,169,63,.16), 0 10px 26px rgba(0,0,0,.55);
  }
  .btn-gold.done { background: linear-gradient(180deg, #fff3c4 0%, #e6c063 100%); }

  /* ---- 共通セクション ---- */
  .sec { position: relative; padding: 46px 22px 48px; background: var(--ink2); text-align: center; }
  .sec::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(60% 40% at 50% 0%, rgba(230,192,99,.12), transparent 70%);
  }
  .sec > * { position: relative; }
  .sec h2.big {
    margin: 0 0 18px; font-family: var(--mincho); font-weight: 900;
    font-size: 26px; line-height: 1.5; letter-spacing: .06em;
  }
  .sec p { margin: 0 0 12px; }

  .steps { display: grid; gap: 10px; margin: 22px 0 0; text-align: left; }
  .step { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: rgba(230,192,99,.05); }
  .step b { flex: none; font: 900 26px/1 var(--mincho); width: 30px; text-align: center; }
  .step span { font-size: 15px; color: #efe6cd; }

  /* ---- 5つの指示文 ---- */
  .list { padding: 46px 16px 20px; background: var(--ink); }
  .card {
    margin: 0 0 22px; padding: 22px 16px 22px; border: 1px solid var(--line); border-radius: 14px;
    background: linear-gradient(180deg, #18121f 0%, var(--card) 100%);
  }
  .card-head { display: flex; gap: 14px; align-items: flex-start; margin: 0 0 16px; }
  .no { flex: none; font: 900 52px/0.95 var(--mincho); }
  .who { margin: 0; padding-top: 4px; font-size: 14px; line-height: 1.7; color: var(--muted); font-weight: 700; }
  .shiji {
    margin: 0 0 14px; padding: 20px 16px; border-radius: 10px;
    background: #fbf5e6; color: #231a08;
    border: 2px solid var(--gold-2);
    font-family: var(--mincho); font-size: 22px; line-height: 1.75; font-weight: 900;
    user-select: all; -webkit-user-select: all;
  }
  .effect { margin: 16px 0 0; font-size: 15.5px; color: #efe6cd; }
  .effect::before { content: "→ "; color: var(--gold-2); font-weight: 800; }

  /* ---- 結び ---- */
  .closing { padding: 52px 22px 64px; background: var(--ink2); text-align: center; }
  .closing .k1 { font-family: var(--mincho); font-weight: 900; font-size: 22px; line-height: 1.8; margin: 0 0 18px; }
  .closing .k2 { font-size: 16px; margin: 0 0 8px; color: #efe6cd; }
  .sign { margin: 34px 0 0; font-size: 13px; letter-spacing: .1em; color: var(--muted); }
  .sign b { display: block; margin-top: 4px; font: 800 15px var(--mincho); letter-spacing: .08em; }
</style>
</head>
<body>
<div class="page">

  <header class="stage">
    <img class="stage-bg" src="assets/sec01-bg.jpg" alt="">
    <div class="stage-veil"></div>
    <div class="stage-text">
      <span class="ribbon">コウキ ／ 同行者</span>
      <h1 class="stage-title gold">指示文5選</h1>
      <p class="stage-sub">コウキが毎日使っているAIへの指示</p>
    </div>
    <div class="stage-cta"><a class="btn-gold" href="#list">5つを見る</a></div>
  </header>

  <section class="sec" id="intro">
    <div class="rule"><i></i></div>
    <div id="intro-body"></div>
    <div class="steps">
      <div class="step"><b class="gold">1</b><span><span class="p">下のボタンで</span><span class="p">指示文をコピー</span></span></div>
      <div class="step"><b class="gold">2</b><span><span class="p">自分のAIに</span><span class="p">貼って送る</span></span></div>
    </div>
  </section>

  <main class="list" id="list"></main>

  <section class="closing" id="closing">
    <div class="rule"><i></i></div>
  </section>

</div>

<script>
/* 文言は原稿どおり。配列は文節ごとの区切り（結合すると原稿の一文になる） */
const INTRO = [
  ["インスタで紹介した5つ、", "コピペ用テキスト版です。"],
  ["そのまま自分のAI（Claude／ChatGPTなど）に", "貼って使ってください。"],
  ["私（コウキ）が", "毎日使ってるAIへの", "指示そのものです。"]
];
const ITEMS = [
  { n: 1, who: "ルールを先に固定したい人へ",
    shiji: ["これはずっと守って。", "投稿・送信・削除の前は、", "必ず私に確認して"],
    effect: ["危ない操作を", "勝手にやらなくなります"] },
  { n: 2, who: "報告が長くて読むのが大変な人へ",
    shiji: ["報告は、", "判明したこと／", "残る不確実性／", "次の一手、", "の3つで。", "要点を先に短く"],
    effect: ["ダラダラした報告が、", "要点だけになります"] },
  { n: 3, who: "言ったことを次に使いたい人へ",
    shiji: ["指示文や引き継ぎは、", "そのままコピペできる", "コードブロックで出して"],
    effect: ["貼るだけで、", "別のAIや次の作業に", "そのまま渡せます"] },
  { n: 4, who: "同じ訂正を何回もしてる人へ",
    shiji: ["間違ってたら直して。", "次から間違えないように、", "覚え直して"],
    effect: ["同じ間違いの訂正が、", "1回で済むようになります"] },
  { n: 5, who: "AIの言うことが本当か不安な人へ",
    shiji: ["ほんと？と思ったら、", "根拠を表にして。", "確認できてないことは", "「未確認」と書いて"],
    effect: ["それっぽい嘘が", "混ざらなくなります"] }
];
const CLOSING = [
  ["大事なのは、", "ツールの新しさじゃなくて", "「最初に何を渡すか」です。"],
  ["まず1つだけ、", "自分のAIに", "渡してみてください。"]
];
const SIGN = "コウキのAIおすそ分け便り";
const LABEL = "この指示文をコピー";

const phr = a => a.map(t => `<span class="p">${t}</span>`).join("");

document.getElementById("intro-body").innerHTML =
  INTRO.map(l => `<p>${phr(l)}</p>`).join("");

document.getElementById("list").innerHTML = ITEMS.map(it => `
  <article class="card">
    <div class="card-head"><span class="no gold">${it.n}</span><p class="who">${it.who}</p></div>
    <div class="shiji" id="s${it.n}">${phr(it.shiji)}</div>
    <button class="btn-gold" type="button" data-n="${it.n}">${LABEL}</button>
    <p class="effect">${phr(it.effect)}</p>
  </article>`).join("");

document.getElementById("closing").insertAdjacentHTML("beforeend",
  `<p class="k1 gold">${phr(CLOSING[0])}</p>` +
  `<p class="k2">${phr(CLOSING[1])}</p>` +
  `<p class="sign">コウキ ／ 同行者<b class="gold">${SIGN}</b></p>`);

document.querySelectorAll(".btn-gold[data-n]").forEach(btn => {
  btn.addEventListener("click", async () => {
    const it = ITEMS[btn.dataset.n - 1];
    try {
      await navigator.clipboard.writeText(it.shiji.join(""));
    } catch (e) {
      const r = document.createRange();
      r.selectNodeContents(document.getElementById("s" + it.n));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      try { document.execCommand("copy"); } catch (_) {}
    }
    btn.textContent = "コピーしました";
    btn.classList.add("done");
    setTimeout(() => { btn.textContent = LABEL; btn.classList.remove("done"); }, 1800);
  });
});
</script>
</body>
</html>
